<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don't Drop the Duck</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game">
    <div id="message">DON'T DROP THE DUCK 🦆</div>

    <div id="player">
      <div id="duck">🦆</div>
      <div id="body"></div>
    </div>

    <div id="ground"></div>
  </div>

  <div id="gameOver">
    <h1>YOU DROPPED THE DUCK 💀</h1>
    <button onclick="restartGame()">TRY AGAIN</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
